name: Build Spark Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Spark Chat project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Spark Chat ZIP found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

          APP_BUILD=$(find project -type f -path "*/app/build.gradle.kts" | head -n 1)

          if [ -z "$APP_BUILD" ]; then
            echo "ERROR: app/build.gradle.kts was not found."
            echo "Files found:"
            find project -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_BUILD")")

          echo "Android project: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Creating settings.gradle.kts"
            printf '%s\n' \
              'pluginManagement {' \
              '    repositories {' \
              '        google()' \
              '        mavenCentral()' \
              '        gradlePluginPortal()' \
              '    }' \
              '}' \
              'dependencyResolutionManagement {' \
              '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
              '    repositories {' \
              '        google()' \
              '        mavenCentral()' \
              '    }' \
              '}' \
              'rootProject.name = "SparkChat"' \
              'include(":app")' \
              > "$PROJECT_DIR/settings.gradle.kts"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build Spark Chat
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SparkChat-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
