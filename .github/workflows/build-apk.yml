name: Build Spark Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Spark Chat ZIP
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir -p project
          unzip -q "SparkChat_GitHub_APK_Project.zip" -d project

          echo "Files extracted:"
          find project -maxdepth 4 -type f | head -100

          SETTINGS=$(find project -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
        uses: gradle/actions/setup-gradle@v4
uses: android-actions/setup-android@v3
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Spark Chat APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Spark Chat APK
        uses: actions/upload-artifact@v4
        with:
          name: SparkChat-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
